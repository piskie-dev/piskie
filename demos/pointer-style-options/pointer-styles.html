    <style>
:root {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  color: #25322f;
  background: #f5f5f1;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  --muted: #78827c;
  --line: #e1e5df;
  --scene-bg: #f8f9f6;
  --scene-text: #35423c;
  --scene-muted: #818b84;
  --scene-border: #e1e7df;
  --scene-button: #fff;
  --scene-primary: #344e42;
  --scene-primary-text: #fff;
}

* { box-sizing: border-box; }
body { margin: 0; }
button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid #59846d; outline-offset: 4px; }
svg { display: block; }
.art-library { position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none; }
.page { width: min(1320px, calc(100% - 64px)); margin: 32px auto 22px; }
.masthead { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
.eyebrow { display: flex; align-items: center; gap: 9px; margin: 0 0 10px; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; color: #66776c; }
.eyebrow-line { width: 19px; height: 2px; background: #769b86; }
h1 { margin: 0 0 10px; font-size: clamp(25px, 2.3vw, 34px); line-height: 1.28; letter-spacing: -1px; font-weight: 650; }
.title-dot { color: #83a491; }
.intro { margin: 0; font-size: 13px; line-height: 1.7; color: #7b847e; }
.preview-note { display: flex; align-items: center; gap: 7px; border: 1px solid #dce3d9; border-radius: 20px; padding: 8px 12px; color: #738274; font-size: 11px; white-space: nowrap; }
.preview-note span { width: 5px; height: 5px; border-radius: 50%; background: #93ab94; }
.toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px 20px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 13px; background: #ffffffbd; }
.background-controls, .playback-controls { display: flex; align-items: center; gap: 6px; }
.background-controls { gap: 12px; }
.control-label { padding-left: 5px; font-size: 11px; color: var(--muted); }
.segmented { display: flex; align-items: center; gap: 3px; padding: 3px; border-radius: 9px; background: #edf0eb; }
.segmented button { display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 66px; padding: 6px 10px; border: 0; border-radius: 6px; background: transparent; color: #7a847c; font-size: 11px; line-height: 17px; }
.segmented button[aria-pressed="true"] { background: #fff; color: #33443b; box-shadow: 0 1px 3px #1c352017; }
.segmented button:hover { color: #253f30; }
.swatch { width: 10px; height: 10px; flex: none; border: 1px solid #344a3726; border-radius: 3px; }
.swatch-light { background: #fff; }
.swatch-dark { background: #293638; border-color: #293638; }
.swatch-image { background: linear-gradient(155deg, #dfd9b5 40%, #7b9690 42%, #47655e 80%); }
.control-button { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 33px; border: 0; padding: 6px 9px; border-radius: 7px; background: transparent; color: #59675d; font-size: 11px; line-height: 19px; white-space: nowrap; }
.control-button:hover { background: #edf1ea; color: #304a3b; }
.control-button svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.control-button .filled { fill: currentColor; stroke: none; }
#toggle-play .play-icon { display: none; }
#toggle-play[aria-pressed="true"] .play-icon { display: block; }
#toggle-play[aria-pressed="true"] .pause-icon { display: none; }
.toolbar-divider { width: 1px; height: 17px; margin: 0 5px; background: var(--line); }
.zoom-trigger { color: #354d40; background: #edf1e9; }
.comparison-caption { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin: 18px 2px 10px; }
.comparison-caption p { display: flex; align-items: center; gap: 8px; margin: 0; color: #849085; font-size: 10px; line-height: 18px; }
.comparison-caption p > span:not(.caption-divider):not(.status-light):not(.progress-track) { font-variant-numeric: tabular-nums; }
.caption-divider { padding: 0 5px; color: #c3cbc1; }
.status-light { width: 4px; height: 4px; border-radius: 50%; background: #92ac94; }
.progress-track { width: 42px; height: 2px; margin-left: 3px; overflow: hidden; border-radius: 2px; background: #dce3d9; }
.progress-track span { display: block; width: 0; height: 100%; background: #829d86; }
.options-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; }
.demo-card { min-width: 0; border: 1px solid #dfe4dc; border-radius: 15px; background: #fff; box-shadow: 0 2px 7px #2c3c2503; overflow: hidden; }
.card-heading { display: flex; align-items: center; gap: 11px; padding: 15px 16px 13px; }
.option-id { display: grid; place-items: center; flex: none; width: 29px; height: 29px; border: 1px solid #e3e8df; border-radius: 8px; background: #f4f6f0; font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 14px; font-weight: 500; color: #57705c; }
.option-title { min-width: 0; }
.option-title h2 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: 0.1px; line-height: 19px; }
.option-title p { margin: 0; color: #8a928c; font-size: 10px; line-height: 15px; }
.option-size { margin-left: auto; padding-left: 5px; color: #98a298; white-space: nowrap; font: 10px ui-monospace, "SFMono-Regular", Consolas, monospace; }
.live-window { position: relative; height: 164px; margin: 0 12px; border: 1px solid var(--scene-border); border-radius: 10px; overflow: hidden; background: var(--scene-bg); color: var(--scene-text); }
.scene-heading { position: absolute; left: 14px; right: 14px; top: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 10px; }
.scene-breadcrumb { display: flex; align-items: center; gap: 6px; }
.workspace-glyph { display: flex; align-items: end; gap: 2px; height: 12px; }
.workspace-glyph i { width: 3px; height: 6px; border-radius: 1px; background: #8caa96; }
.workspace-glyph i:nth-child(2) { height: 10px; }
.workspace-glyph i:nth-child(3) { height: 8px; }
.scene-meta { font-size: 9px; color: var(--scene-muted); }
.scene-thumbnail { position: absolute; top: 43px; left: 14px; width: 91px; height: 66px; border: 1px solid #203e4110; border-radius: 7px; overflow: hidden; }
.scene-thumbnail img { width: 100%; height: 100%; object-fit: cover; }
.scene-copy { position: absolute; top: 51px; left: 118px; right: 12px; }
.scene-copy h3 { margin: 0 0 7px; font-size: 13px; font-weight: 550; letter-spacing: 0.3px; }
.scene-copy p { margin: 0; font-size: 10px; color: var(--scene-muted); line-height: 17px; }
.scene-tag { display: inline-block; margin-top: 5px; padding: 1px 5px; border: 1px solid var(--scene-border); border-radius: 4px; color: var(--scene-muted); font-size: 8px; line-height: 13px; }
.scene-primary, .scene-note, .scene-image-button { position: absolute; display: flex; align-items: center; justify-content: center; gap: 9px; height: 29px; border: 1px solid var(--scene-border); border-radius: 6px; font-size: 10px; }
.scene-primary { bottom: 12px; right: 14px; min-width: 89px; padding: 0 10px; border-color: transparent; background: var(--scene-primary); color: var(--scene-primary-text); }
.scene-primary span { font-size: 13px; line-height: 12px; font-weight: 300; }
.scene-note { bottom: 12px; left: 14px; min-width: 80px; padding: 0 8px; background: var(--scene-button); color: var(--scene-text); }
.scene-note svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1.1; }
.scene-image-button { top: 6px; right: 6px; width: 22px; height: 22px; border-color: #ffffff80; background: #ffffffe6; color: #46574d; backdrop-filter: blur(6px); }
.scene-image-button svg { width: 10px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linejoin: round; }
.scene-primary.is-pressed { background: #244334; box-shadow: inset 0 0 0 1px #ffffff40; }
.scene-note.is-pressed { background: #e2eade; color: #2e4b37; }
.scene-image-button.is-pressed { background: #e4eee0; }
.scene-image-button.is-pressed svg { fill: #728b78; }
.live-pointer { position: absolute; top: 0; left: 0; z-index: 3; pointer-events: none; will-change: transform; }
.live-pointer .pointer-art { overflow: visible; }
.click-ring { position: absolute; width: 10px; height: 10px; border: 1.15px solid var(--ring, #55676d); border-radius: 50%; box-shadow: 0 0 0 0.75px #ffffffc4; pointer-events: none; z-index: 2; opacity: 0; }
.detail-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 91px; padding: 9px 17px 10px; }
.detail-note { max-width: 112px; color: #8d978e; font-size: 10px; line-height: 18px; }
.detail-note strong { display: block; font-size: 10px; color: #647265; font-weight: 450; }
.sample-pair { display: flex; justify-content: center; align-items: center; gap: 20px; }
.detail-sample { display: flex; flex-direction: column; align-items: center; justify-content: end; gap: 2px; min-width: 49px; }
.detail-art-box { display: flex; align-items: center; justify-content: center; height: 66px; }
.detail-sample span { color: #9aa398; font-size: 8px; line-height: 12px; }
.detail-art { overflow: visible; filter: none !important; }
.page-footer { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin: 15px 2px 0; }
.page-footer p { margin: 0; font-size: 10px; color: #98a094; line-height: 18px; }
.no-script { padding: 20px; color: #405a48; }

/* Artwork shares a fixed hotspot in both states; color and surface carry the press. */
.pointer-art { --core: #fbfcfc; --outline: #26333d; --outline-width: 1.05; --edge-width: 2.35; filter: drop-shadow(0 0.6px 0.75px #14253140); }
.edge { fill: none; stroke: #ffffffed; stroke-width: var(--edge-width, 2.35); stroke-linejoin: round; }
.core { fill: var(--core, #fff); stroke: var(--outline, #26333d); stroke-width: var(--outline-width, 1.05); stroke-linejoin: round; }
.glint { fill: none; stroke: #ffffff7a; stroke-width: 0.55; stroke-linecap: round; }
.facet { fill: var(--facet, #ffffff66); }
.accent { fill: none; stroke: var(--accent, #9e6934); stroke-width: 0.7; stroke-linecap: round; }
.fold { fill: none; stroke: #557f9740; stroke-width: 0.5; stroke-linecap: round; }
.scheme-a { --ring: #4e5e69; }
.pointer-art.scheme-a[data-pressed="true"] { --core: #c3cdd2; --outline: #1c2933; }
.scheme-b { --ring: #647283; }
.pointer-art.scheme-b { --core: #606b77; --outline: #263440; --outline-width: 0.65; --edge-width: 2.15; filter: drop-shadow(0 0.4px 0.6px #17263640); }
.pointer-art.scheme-b[data-pressed="true"] { --core: #293b4c; --outline: #192934; }
.scheme-c { --ring: #ad733a; }
.pointer-art.scheme-c { --core: #edbb77; --outline: #6b5033; --outline-width: 0.95; --edge-width: 2.35; --facet: #ffedc4; --accent: #a4703a; }
.pointer-art.scheme-c[data-pressed="true"] { --core: #d89550; --outline: #63422a; --facet: #ffdda5; --accent: #835a35; }
.scheme-d { --ring: #4e96b6; }
.pointer-art.scheme-d { --core: url(#mist-rest); --outline: #3c637a; --outline-width: 0.8; --edge-width: 2.25; --facet: #ffffff73; filter: drop-shadow(0 0 1.15px #a6ddf387) drop-shadow(0 0.6px 0.65px #142d3b33); }
.pointer-art.scheme-d[data-pressed="true"] { --core: url(#mist-press); --outline: #30556c; --facet: #e1f8ff73; }
.scheme-e { --ring: #618272; }
.pointer-art.scheme-e { --dot: #fffdf7; --dot-center: #799788; filter: drop-shadow(0 0.5px 0.7px #253a3340); }
.dot-edge { fill: #34483e; stroke: #fffffff0; stroke-width: 1.4; }
.dot-core { fill: var(--dot, #fffdf7); stroke: #34483e; stroke-width: 0.7; }
.dot-center { fill: var(--dot-center, #799788); }
.pointer-art.scheme-e[data-pressed="true"] { --dot: #4c7462; --dot-center: #f6fff8; }
.scheme-f { --ring: #697d83; }
.pointer-art.scheme-f { --reticle: #41535b; filter: none; }
.reticle-edge { fill: none; stroke: #fffffff2; stroke-width: 2.9; stroke-linecap: round; }
.reticle-core { fill: none; stroke: var(--reticle, #41535b); stroke-width: 1.1; stroke-linecap: round; }
.reticle-dot { fill: var(--reticle, #41535b); stroke: #fffffff2; stroke-width: 0.65; }
.pointer-art.scheme-f[data-pressed="true"] { --reticle: #255b66; }

body[data-preview-background="image"] .scene-heading { padding: 4px 7px; top: 8px; left: 9px; right: 9px; border: 1px solid #ffffff50; border-radius: 5px; background: #f4f5ecba; backdrop-filter: blur(7px); }

.details-dialog { width: min(1100px, calc(100% - 48px)); max-height: calc(100% - 40px); margin: auto; border: 1px solid #d5ded0; border-radius: 20px; padding: 24px; background: #f7f8f3; color: #25372d; box-shadow: 0 20px 100px #1428213d; }
.details-dialog::backdrop { background: #24342cc4; backdrop-filter: blur(6px); }
.dialog-heading { display: flex; align-items: start; justify-content: space-between; gap: 20px; }
.dialog-heading .eyebrow { margin-bottom: 7px; color: #80917f; font-size: 10px; }
.dialog-heading h2 { margin: 0; font-size: 25px; font-weight: 600; letter-spacing: -0.6px; }
.dialog-intro { margin: 8px 0 0; color: #8b9688; font-size: 11px; }
.close-button { display: grid; place-items: center; flex: none; width: 31px; height: 31px; padding: 0; border: 1px solid #dce3d7; border-radius: 9px; background: #fff; color: #63775f; }
.close-button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; }
.close-button:hover { background: #e8eee2; }
.dialog-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 19px 0 15px; }
.dialog-toolbar > span { color: #99a191; font-size: 10px; }
.zoom-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.zoom-card { overflow: hidden; border: 1px solid #dfe6d8; border-radius: 11px; background: #fff; }
.zoom-card-heading { display: flex; align-items: center; gap: 8px; padding: 11px 13px; }
.zoom-card-heading .option-id { width: 23px; height: 23px; font-size: 11px; border-radius: 6px; }
.zoom-card-heading h3 { margin: 0; font-size: 12px; font-weight: 550; }
.zoom-card-heading > span { margin-left: auto; color: #9ba597; font-size: 9px; }

        <div class="scene-copy"><h3>周末计划</h3><p>留一点空白，去看看风景</p><span class="scene-tag">慢一点也很好</span></div>
        <button type="button" class="scene-note" data-target="note" aria-label="${variant.id} 查看详情，定格点击">查看详情${arrowIcon}</button>
        <button type="button" class="scene-primary" data-target="primary" aria-label="${variant.id} 加入清单，定格点击">加入清单<span aria-hidden="true">＋</span></button>
        <span class="click-ring" aria-hidden="true"></span>
        <div class="live-pointer" aria-hidden="true">${artwork(variant, false, 1)}</div>
      </div>
      <div class="detail-row">
        <div class="detail-note"><strong>${variant.note[0]}</strong>${variant.note[1]}</div>
        <div class="sample-pair" aria-label="${variant.id} 正常和按下状态，三倍放大">
          <div class="detail-sample"><div class="detail-art-box">${artwork(variant, false, 3, 'detail-art')}</div><span>正常</span></div>
          <div class="detail-sample"><div class="detail-art-box">${artwork(variant, true, 3, 'detail-art')}</div><span>按下</span></div>
        </div>
      </div>
    </article>`).join('');

  zoomGrid.innerHTML = variants.map((variant) => `
    <article class="zoom-card" data-zoom-option="${variant.id}" aria-label="${variant.id} ${variant.name}，六倍放大">
      <div class="zoom-card-heading"><span class="option-id" aria-hidden="true">${variant.id}</span><h3>${variant.name}</h3><span>${variant.size}</span></div>
      <div class="zoom-stage">
        <div class="zoom-sample"><div class="zoom-art-box">${artwork(variant, false, 6, 'detail-art')}</div><span>正常</span></div>
        <div class="zoom-sample"><div class="zoom-art-box">${artwork(variant, true, 6, 'detail-art')}</div><span>按下</span></div>
      </div>
    </article>`).join('');

  const cards = variants.map((variant) => {
    const card = grid.querySelector(`[data-option="${variant.id}"]`);
    const scene = card.querySelector('.live-window');
    return {
      variant,
      card,
      scene,
      pointer: card.querySelector('.live-pointer'),
      art: card.querySelector('.live-pointer .pointer-art'),
      ring: card.querySelector('.click-ring'),
      buttons: Object.fromEntries([...scene.querySelectorAll('[data-target]')].map((button) => [button.dataset.target, button])),
      points: {},
    };
  });

  function measure() {
    for (const card of cards) {
      const rect = card.scene.getBoundingClientRect();
      const borderLeft = card.scene.clientLeft;
      const borderTop = card.scene.clientTop;
      card.points.start = { x: card.scene.clientWidth * 0.21, y: card.scene.clientHeight * 0.2 };
      for (const [name, button] of Object.entries(card.buttons)) {
        const buttonRect = button.getBoundingClientRect();
        card.points[name] = {
          x: buttonRect.left - rect.left - borderLeft + buttonRect.width / 2,
          y: buttonRect.top - rect.top - borderTop + buttonRect.height / 2,
        };
      }
    }
    render();
  }

  function stateAt(time, points) {
    const move = [...moves].reverse().find((entry) => time >= entry.at);
    if (!move) return { point: points.start, phase: '停留', pressed: false, target: 'start', ringProgress: null };
    const elapsed = time - move.at;
    if (elapsed < moveMs) {
      const progress = 1 - (1 - elapsed / moveMs) ** 3;
      const from = points[move.from];
      const to = points[move.to];
      return {
        point: { x: from.x + (to.x - from.x) * progress, y: from.y + (to.y - from.y) * progress },
        phase: '移动', pressed: false, target: move.to, ringProgress: null,
      };
    }
    const clickAge = elapsed - moveMs;
    const ringing = move.click && clickAge < ringMs;
    return {
      point: points[move.to], phase: ringing ? '点击' : '停留',
      pressed: move.click && clickAge < pressMs, target: move.to,
      ringProgress: ringing ? clickAge / ringMs : null,
    };
  }

  function render() {
    let phase = '停留';
    for (const card of cards) {
      if (!card.points.start) continue;
      const state = stateAt(sceneTime, card.points);
      phase = state.phase;
      card.pointer.style.transform = `translate3d(${state.point.x - card.variant.tip[0]}px, ${state.point.y - card.variant.tip[1]}px, 0)`;
      card.pointer.dataset.tipX = state.point.x.toFixed(3);
      card.pointer.dataset.tipY = state.point.y.toFixed(3);
      card.art.dataset.pressed = String(state.pressed);
      card.card.dataset.phase = state.phase;
      card.card.dataset.target = state.target;
      for (const [name, button] of Object.entries(card.buttons)) button.classList.toggle('is-pressed', state.pressed && name === state.target);
      if (state.ringProgress !== null) {
        const progress = 1 - (1 - state.ringProgress) ** 2;
        card.ring.style.left = `${state.point.x}px`;
        card.ring.style.top = `${state.point.y}px`;
        card.ring.style.transform = `translate(-50%, -50%) scale(${0.65 + progress * 1.95})`;
        card.ring.style.opacity = String(0.82 * (1 - state.ringProgress));
      } else {
        card.ring.style.opacity = '0';
      }
    }
    phaseLabel.textContent = `${running ? '同步演示' : '已暂停'} · ${phase}`;
    progressFill.style.width = `${sceneTime / cycleMs * 100}%`;
    grid.dataset.sceneTime = sceneTime.toFixed(3);
    grid.dataset.running = String(running);
    playButton.setAttribute('aria-pressed', String(!running));
    playButton.querySelector('span').textContent = running ? '暂停' : '播放';
  }

  function tick(timestamp) {
    animationFrame = 0;
    if (!running) return;
    if (previousFrame !== null) sceneTime = (sceneTime + timestamp - previousFrame) % cycleMs;
    previousFrame = timestamp;
    render();
    animationFrame = requestAnimationFrame(tick);
  }

  function setRunning(next) {
    running = next;
    previousFrame = null;
    if (animationFrame) cancelAnimationFrame(animationFrame);
    animationFrame = 0;
    render();
    if (running) animationFrame = requestAnimationFrame(tick);
  }

  function freezeAtTarget(target) {
    const move = moves.find((entry) => entry.to === target && entry.click);
    sceneTime = move.at + moveMs + 42;
    setRunning(false);
  }

  document.querySelectorAll('[data-background]').forEach((button) => {
    button.addEventListener('click', () => {
      const background = button.dataset.background;
      document.body.dataset.previewBackground = background;
      document.querySelectorAll('[data-background]').forEach((choice) => choice.setAttribute('aria-pressed', String(choice.dataset.background === background)));
      measure();
    });
  });
  playButton.addEventListener('click', () => setRunning(!running));
  document.querySelector('#replay').addEventListener('click', () => {
    sceneTime = 0;
    setRunning(true);
  });
  document.querySelector('#freeze-press').addEventListener('click', () => freezeAtTarget('primary'));
  grid.querySelectorAll('[data-target]').forEach((button) => button.addEventListener('click', () => freezeAtTarget(button.dataset.target)));
  document.querySelector('#open-details').addEventListener('click', () => {
    playingBeforeDialog = running;
    setRunning(false);
    dialog.showModal();
  });
  function closeDetails() {
    dialog.close();
    setRunning(playingBeforeDialog);
  }
  document.querySelector('#close-details').addEventListener('click', closeDetails);
  dialog.addEventListener('cancel', (event) => {
    event.preventDefault();
    closeDetails();
  });
  reducedMotion.addEventListener('change', (event) => { if (event.matches) setRunning(false); });
  const observer = new ResizeObserver(measure);
  cards.forEach((card) => observer.observe(card.scene));
  measure();
  setRunning(running);
})();

</script>
