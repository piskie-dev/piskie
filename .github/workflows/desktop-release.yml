name: Desktop release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:verify -- "${GITHUB_REF_NAME}"
      - name: Require the tagged commit to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm run check:i18n
      - run: npm run check:styles
      - run: npm run lint
      - run: npm run type-check
      - run: npx tsc -p tsconfig.electron.json --noEmit
      - run: npm test
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true"
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --title "Piskie ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: release:win
          - os: macos-latest
            command: release:mac
          - os: ubuntu-latest
            command: release:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:verify -- "${{ github.ref_name }}"
      - name: Build and upload release assets
        run: npm run ${{ matrix.command }}
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

  verify-draft:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Verify the draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true"
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          for required in latest.yml latest-mac.yml latest-linux.yml; do
            grep -Fx "$required" <<<"$assets" >/dev/null
          done
          grep -E '\.exe$' <<<"$assets" >/dev/null
          grep -E '\.dmg$' <<<"$assets" >/dev/null
          grep -E '\.zip$' <<<"$assets" >/dev/null
          grep -E '\.deb$' <<<"$assets" >/dev/null
          echo "Draft release assets verified: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
